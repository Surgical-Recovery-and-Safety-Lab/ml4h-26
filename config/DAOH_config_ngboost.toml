[meta]
project_name = "DAOH"
run_mode = "fast"
verbose = 1

[data]
path = "/pvol/mroe734/data/NZ_data.v2.parquet"
predictors = [
  "AGE",
  "SEX",
  "PRIOR_CANCER",
  "ETHNICITY",
  "ASA",
  "ADMISSION_ACUITY",
  "ADMISSION_SOURCE",
  "CATEGORY_LEVEL_1",
  "CATEGORY_LEVEL_2",
  "OP_SEVERITY",
  "TRAUMA",
]
outcomes = ["DAOH_90"]

# ------------------------------------------------------------------------------
# DEFAULT MODEL SETUP
# ------------------------------------------------------------------------------
[default_model]
algorithm = "NGBRegressor"

[default_model.hyperparameters]
learning_rate = 0.1
early_stopping_rounds = 10
n_estimators = 100

# ------------------------------------------------------------------------------
# WORKFLOW
# ------------------------------------------------------------------------------
[workflow]
random_state = 42
n_jobs = 2

[workflow.preprocessing]
preprocess = true
operations = [
  { name = "OrdinalEncoder", columns = [
    "SEX",
    "ETHNICITY",
    "ADMISSION_ACUITY",
    "ADMISSION_SOURCE",
    "CATEGORY_LEVEL_1",
    "CATEGORY_LEVEL_2",
  ] },
]

[workflow.validation.test_split]
strategy = "group"
group_column = "OP_YEAR"
values = [2023, 2024]

[workflow.validation.cross_validation]
strategy = "group"
grid_search = false
group_column = "DHB_NAME"
n_splits = 20
shuffle = true

[workflow.evaluation.metrics]
metrics = ["mae"]
n_bootstraps = 50
ci_level = 0.95
